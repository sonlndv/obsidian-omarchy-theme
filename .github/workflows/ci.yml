name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -v
      - run: node --check companion/main.js
      - run: node --test tests/test_companion.cjs
      - run: python3 -B bin/build.py
      - run: git diff --exit-code -- theme.css manifest.json OFL-Geist.txt OFL-SpaceMono.txt
